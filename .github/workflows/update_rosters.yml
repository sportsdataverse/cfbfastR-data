name: Annual Roster Update

# Same commit-serialization group as daily_cfb.yml: both workflows push to main.
concurrency:
  group: ${{ github.repository }}-commit
  cancel-in-progress: false

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}

    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            sportsdataverse/cfbfastR
      - name: Run annual roster update
        run: Rscript add_rosters.R
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- rosters
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "Annual team roster update"
          git push origin HEAD || { git fetch origin main && git rebase --merge origin/main && git push origin HEAD; }
