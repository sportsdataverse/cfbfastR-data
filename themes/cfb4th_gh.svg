<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!--
    cfb4th social card, 1280x640. Part of the SportsDataverse card family:
    gradient field in the package's own brand color, a sport motif watermark,
    the wordmark, a tagline, and the gold divider + diamond that every card in
    the family shares. Generated by make_cards.py; edit the config there and
    re-render rather than hand-editing this file.
  -->
  <defs>
