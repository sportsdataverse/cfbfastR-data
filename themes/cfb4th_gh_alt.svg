<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!--
    cfb4th social card, 1280x640. Part of the SportsDataverse card family:
    gradient field in the package's own brand color, a sport motif watermark,
    the wordmark, a tagline, and the gold-topped footer bar carrying the URL.
    Generated by make_cards.py; edit the config there and re-render rather
    than hand-editing this file.
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A1010"/>
      <stop offset="100%" stop-color="#0D0505"/>
    </linearGradient>
    <radialGradient id="focus" cx="50%" cy="39%" r="62%">
      <stop offset="0%" stop-color="#0D0505" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#0D0505" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#field)"/>

  <!-- motif sits back so the type leads; it fought the tagline at 0.45 -->
  <g opacity="0.32">
    <g stroke="#6B3A3A" stroke-width="6" fill="none">
    <path d="M120,70 V570"/>
    <path d="M230,70 V570"/>
    <path d="M340,70 V570"/>
    <path d="M450,70 V570"/>
    <path d="M560,70 V570"/>
    <path d="M670,70 V570"/>
    <path d="M780,70 V570"/>
    <path d="M890,70 V570"/>
    <path d="M1000,70 V570"/>
    <path d="M1110,70 V570"/>
    <path d="M1220,70 V570"/>
    </g>
    <g stroke="#F0A800" stroke-width="12" fill="none" stroke-linecap="round"><path d="M340,70 V570"/><path d="M340,320 H960"/><path d="M960,70 V570"/></g>
    <g fill="#F0A800">
    <circle cx="360" cy="320" r="9"/>
    <circle cx="400" cy="320" r="9"/>
    <circle cx="440" cy="320" r="9"/>
    <circle cx="480" cy="320" r="9"/>
    <circle cx="520" cy="320" r="9"/>
    <circle cx="560" cy="320" r="9"/>
    <circle cx="600" cy="320" r="9"/>
    <circle cx="640" cy="320" r="9"/>
    <circle cx="680" cy="320" r="9"/>
    <circle cx="720" cy="320" r="9"/>
    <circle cx="760" cy="320" r="9"/>
    <circle cx="800" cy="320" r="9"/>
    <circle cx="840" cy="320" r="9"/>
    <circle cx="880" cy="320" r="9"/>
    <circle cx="920" cy="320" r="9"/>
    <circle cx="960" cy="320" r="9"/>
    </g>
    <text x="70" y="575" text-anchor="start" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif" font-size="190" font-weight="700" fill="#F0A800" opacity="0.45">4</text>
    <text x="1210" y="575" text-anchor="end" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif" font-size="190" font-weight="700" fill="#F0A800" opacity="0.45">4</text>
  </g>
  <!-- soft pool behind the type so the motif never runs through a letterform -->
  <rect width="1280" height="554" fill="url(#focus)"/>

  <text x="640" y="290" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="146" font-weight="700"
        stroke="#0D0505" stroke-width="14" paint-order="stroke"><tspan fill="#FFFFFF">cfb4th</tspan></text>

  <text x="640" y="359" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="34" font-weight="600" fill="#F0A800"
        letter-spacing="3">FOURTH DOWN DECISIONS, MODELED</text>

  <rect x="0" y="554" width="1280" height="86" fill="#0D0505"/>
  <rect x="0" y="554" width="1280" height="4" fill="#FFB612"/>
  <text x="640" y="612" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="32" font-weight="600" fill="#EEF2F6"
        letter-spacing="2">cfb4th.sportsdataverse.org</text>
</svg>
