<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!--
    cfbplotR social card, 1280x640. Part of the SportsDataverse card family:
    gradient field in the package's own brand color, a sport motif watermark,
    the wordmark, a tagline, and the gold-topped footer bar carrying the URL.
    Generated by make_cards.py; edit the config there and re-render rather
    than hand-editing this file.
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B2430"/>
      <stop offset="100%" stop-color="#04121A"/>
    </linearGradient>
    <radialGradient id="focus" cx="50%" cy="39%" r="62%">
      <stop offset="0%" stop-color="#04121A" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#04121A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#field)"/>

  <!-- motif sits back so the type leads; it fought the tagline at 0.45 -->
  <g opacity="0.32">
    <g stroke="#2F5F72" stroke-width="6" fill="none"><path d="M120,560 H1160"/><path d="M120,80 V560"/></g>
    <g stroke="#2F5F72" stroke-width="3" fill="none" opacity="0.6">
    <path d="M120,140 H1160"/>
    <path d="M120,245 H1160"/>
    <path d="M120,350 H1160"/>
    <path d="M120,455 H1160"/>
    <path d="M120,560 H1160"/>
    <path d="M240,80 V560"/>
    <path d="M360,80 V560"/>
    <path d="M480,80 V560"/>
    <path d="M600,80 V560"/>
    <path d="M720,80 V560"/>
    <path d="M840,80 V560"/>
    <path d="M960,80 V560"/>
    <path d="M1080,80 V560"/>
    </g>
    <g fill="#7FD4C1" opacity="0.9">
    <polygon points="240,474 263,487 263,513 240,526 217,513 217,487"/>
    <polygon points="360,429 383,442 383,468 360,481 337,468 337,442"/>
    <polygon points="480,444 503,457 503,483 480,496 457,483 457,457"/>
    <polygon points="600,364 623,377 623,403 600,416 577,403 577,377"/>
    <polygon points="720,324 743,337 743,363 720,376 697,363 697,337"/>
    <polygon points="840,274 863,287 863,313 840,326 817,313 817,287"/>
    <polygon points="960,229 983,242 983,268 960,281 937,268 937,242"/>
    <polygon points="1080,149 1103,162 1103,188 1080,201 1057,188 1057,162"/>
    <polygon points="300,354 323,367 323,393 300,406 277,393 277,367"/>
    <polygon points="660,479 683,492 683,518 660,531 637,518 637,492"/>
    <polygon points="900,394 923,407 923,433 900,446 877,433 877,407"/>
    <polygon points="1020,304 1043,317 1043,343 1020,356 997,343 997,317"/>
    </g>
  </g>
  <!-- soft pool behind the type so the motif never runs through a letterform -->
  <rect width="1280" height="554" fill="url(#focus)"/>

  <text x="640" y="290" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="146" font-weight="700"
        stroke="#04121A" stroke-width="14" paint-order="stroke"><tspan fill="#FFFFFF">cfbplotR</tspan></text>

  <text x="640" y="359" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="34" font-weight="600" fill="#7FD4C1"
        letter-spacing="3">TEAM LOGOS AND COLORS FOR GGPLOT2</text>

  <rect x="0" y="554" width="1280" height="86" fill="#04121A"/>
  <rect x="0" y="554" width="1280" height="4" fill="#FFB612"/>
  <text x="640" y="612" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif"
        font-size="32" font-weight="600" fill="#EEF2F6"
        letter-spacing="2">cfbplotR.sportsdataverse.org</text>
</svg>
